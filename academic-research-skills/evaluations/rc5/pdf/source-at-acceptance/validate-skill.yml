name: Validate Research Paper Workflow

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            pdf-backend: pdftotext
          - python-version: "3.13"
            pdf-backend: pypdf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real pdftotext backend
        if: matrix.pdf-backend == 'pdftotext'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          command -v pdftotext
          pdftotext -v
      - name: Prepare pypdf-only backend
        if: matrix.pdf-backend == 'pypdf'
        run: |
          sudo apt-get remove --yes poppler-utils
          python -m pip install pypdf==6.10.0
          python -c 'import pypdf, shutil; assert shutil.which("pdftotext") is None; print(pypdf.__version__)'
      - name: Prepare fresh CI reports
        run: >-
          python -c 'from pathlib import Path;
          [Path(p).unlink(missing_ok=True) for p in
          ["validation-report.json", "academic-research-skills/test-results/regression.json",
          "academic-research-skills/test-results/regression.txt"]]'
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate complete offline fixture
        if: always()
        run: >-
          python research-paper-workflow/scripts/validate_research_package.py
          tests/fixtures/complete-project
          --profile auto
          --report validation-report.json
      - name: Check complete library build consistency
        run: python academic-research-skills/scripts/build_release.py --check
      - name: Run complete library regression
        if: always()
        run: python academic-research-skills/tests/run_all.py
      - name: Save actual PDF result-link acceptance reports
        if: always()
        run: >-
          python academic-research-skills/tests/report_pdf_links.py
          --backend ${{ matrix.pdf-backend }}
          --regression academic-research-skills/test-results/regression.json
          --out "${{ runner.temp }}/pdf-result-links"
      - name: Run portable basic smoke
        run: python academic-research-skills/scripts/selftest.py --out "${{ runner.temp }}/academic-skill-smoke"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-python-${{ matrix.python-version }}-${{ matrix.pdf-backend }}
          path: |
            validation-report.json
            academic-research-skills/test-results/regression.json
            academic-research-skills/test-results/regression.txt
            ${{ runner.temp }}/pdf-result-links/
