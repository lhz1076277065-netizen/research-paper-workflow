name: wave-gap-reconstruction-study-runner

on:
  push:
    branches: [wave-imputation-study-20260826]
    paths:
      - 'experiments/wave_gap_study.py.gz.b64'
      - 'experiments/run_trigger.txt'

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore and verify analysis script
        shell: bash
        run: |
          base64 --decode experiments/wave_gap_study.py.gz.b64 | gzip --decompress > experiments/wave_gap_study.py
          echo '1626b4a1544e036f31e90f69f19004eae640b462c8dfc942a975bf7232fe74c1  experiments/wave_gap_study.py' | sha256sum --check --strict
          python -m py_compile experiments/wave_gap_study.py
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'matplotlib>=3.8,<4' 'requests>=2.31,<3' 'joblib>=1.3,<2'
      - name: Execute study
        run: python experiments/wave_gap_study.py --output-dir wave_study_output
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-gap-study-output
          path: wave_study_output
          if-no-files-found: error
          retention-days: 14
