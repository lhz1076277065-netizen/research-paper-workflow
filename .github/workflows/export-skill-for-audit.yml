name: Export Research Paper Workflow for Audit

on:
  push:
    branches:
      - automation/outdoor-education-review-20260825

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Upload skill source
        uses: actions/upload-artifact@v7
        with:
          name: research-paper-workflow-skill-source
          path: research-paper-workflow
          include-hidden-files: true
