name: Validate Research Paper Workflow

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate complete offline fixture
        run: >-
          python research-paper-workflow/scripts/validate_research_package.py
          tests/fixtures/complete-project
          --profile auto
          --report validation-report.json
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-python-${{ matrix.python-version }}
          path: validation-report.json
